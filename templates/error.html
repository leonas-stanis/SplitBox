{% extends "layout.html" %}
{% block title %}{{ status_code }} — SplitBox{% endblock %}

{% block content %}
<section class="section window" data-title="System Error">
  <div class="empty-state">
    <p class="eyebrow">{{ status_code }}</p>
    <h1>{{ message or "Something went wrong" }}</h1>
    <p>The page you asked for could not be loaded.</p>
    <p><a class="btn btn-primary" href="/">Back to the start</a></p>
  </div>
</section>
{% endblock %}
